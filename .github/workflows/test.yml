name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install shellcheck, PyYAML and jq
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck python3-yaml jq
      - name: Lint
        run: shellcheck -S warning bin/guard install.sh lib/*.sh templates/guard/run templates/guard/bin/*.sh tests/run.sh tests/atlas-fixture.sh tests/mock-bin/* examples/quickstart/run.sh examples/quickstart/job.sh examples/quickstart/checks/*
      - name: Compile Python
        run: python3 -m py_compile lib/*.py
      - name: End-to-end tests
        run: tests/run.sh
