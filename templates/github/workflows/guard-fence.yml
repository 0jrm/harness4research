name: guard-fence

# pull_request_target runs this file and the fence script from the base branch.
# The pull request is fetched as data and never executed, so this is safe for forks.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request head as data
        # persist-credentials is off above, so on a private repository an anonymous
        # fetch fails. The read-only job token fetches the head; it is never checked out.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: Run the base branch's fence against the pull request
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash guard/bin/fence.sh "origin/${BASE_REF}" pr/head
