name: guard-fence

# pull_request_target runs this file from the base branch, and the fence of the harness release the base branch pins.
# The pull request is fetched as data and never executed, so this is safe for forks.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request head as data
        # persist-credentials is off above, so on a private repository an anonymous
        # fetch fails. The read-only job token fetches the head; it is never checked out.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: Read the harness pin from the base branch
        id: pin
        # guard/budget.card's harness: line pins the harness4research release the fence comes from. An offline project
        # carries that release in guard/harness-<pin>.sh on the base branch; for any other pin the next step checks the
        # harness out at the pin. A card without the line predates the pin, and its fence is guard/bin/fence.sh.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          pin=$(git show "origin/${BASE_REF}:guard/budget.card" | awk -F': *' '$1 == "harness" { print $2; exit }')
          from=bin
          if [ -n "$pin" ]; then
            [[ $pin =~ ^(v[0-9][0-9A-Za-z._-]*|[0-9a-f]{40})$ ]] \
              || { echo "guard/budget.card on ${BASE_REF} pins harness: ${pin}, which is neither a release tag nor a full commit" >&2; exit 1; }
            from=clone
            if git cat-file -e "origin/${BASE_REF}:guard/harness-${pin}.sh" 2>/dev/null; then from=vendored; fi
          fi
          echo "harness: ${pin:-none}; the fence comes from ${from}"
          { echo "pin=${pin}"; echo "from=${from}"; } >> "$GITHUB_OUTPUT"
      - name: Check out harness4research at the pin
        if: steps.pin.outputs.from == 'clone'
        uses: actions/checkout@v4
        with:
          repository: 0jrm/harness4research
          ref: ${{ steps.pin.outputs.pin }}
          path: .guard-harness
          persist-credentials: false
      - name: Run the base branch's fence against the pull request
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FROM: ${{ steps.pin.outputs.from }}
        run: |
          if [ "$FROM" = bin ]; then exec bash guard/bin/fence.sh "origin/${BASE_REF}" pr/head; fi
          HPC_GUARD_REF="origin/${BASE_REF}" HPC_HARNESS="$GITHUB_WORKSPACE/.guard-harness" bash guard/run fence "origin/${BASE_REF}" pr/head
